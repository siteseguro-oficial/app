<style>
:root{color-scheme:light;
  --wine:#1F5F6B;--wine2:#2A7C8C;--dark:#06262D;--gold:#C98A1E;--gold2:#F0B844;
  --cream:#F6F8F7;--paper:#fff;--rose:#E6F0F1;--ink:#152226;--muted:#5C7077;--line:#DCE6E7;--water:#3F86C2;
  --serif:"Fredoka","Inter",system-ui,sans-serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --shadow:0 1px 2px rgba(6,38,45,.05),0 6px 18px rgba(6,38,45,.07);--hair:1px solid #DCE6E7;
  --moro:#D1664A;--moro2:#E79672;--sage:#3F7D5A;--sage2:#8FBF7A;--plum:#4B3C6E;--plum2:#7E6CA8;--sky:#2F78B7;--sky2:#8FC3EA;--amber:#D99A2B;--amber2:#F0C75E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body{background:radial-gradient(900px 500px at 110% -10%,#DCECEF 0%,transparent 55%),radial-gradient(700px 500px at -20% 40%,#E7F0EC 0%,transparent 60%),#F6F8F7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea{font:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.press{transition:transform .15s ease}.press:active{transform:scale(.96)}
html,body{min-height:100%;overscroll-behavior-y:none}
html{background:#F6F8F7}
html.is-ob,html.is-ob body{background:#06262D}
html.is-ob .app{max-width:none;padding-bottom:0;min-height:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(104px + var(--sb));position:relative}
h1,h2,h3{font-family:var(--serif);color:var(--wine);font-weight:600;line-height:1.1}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 20px 12px}
.sec-h h2{font-size:23px}.sec-h span{font-size:13px;color:var(--muted)}
.card{background:var(--paper);margin:0 16px;border-radius:16px;padding:18px;box-shadow:var(--shadow);border:var(--hair)}
.muted{color:var(--muted)}
.i{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
/* HERO */
.hero{background:radial-gradient(ellipse at 85% -10%,#2F8EA0 0%,#1F5F6B 38%,#0E3A44 75%,#06262D 100%);background-size:160% 160%;animation:flow 16s ease-in-out infinite alternate;color:#fff;padding:calc(16px + var(--st)) 20px 30px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
@keyframes flow{0%{background-position:0% 0%}100%{background-position:100% 60%}}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-120px;top:-140px;border-radius:50%;border:1px solid rgba(240,184,68,.22)}
.hero::after{content:"";position:absolute;width:220px;height:220px;left:-90px;bottom:-120px;border-radius:50%;border:1px solid rgba(240,184,68,.16)}
.topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;color:#fff}
.brand svg{width:26px;height:26px}
.brand .wm{display:flex;align-items:baseline;gap:6px;font-size:22px;color:#fff;font-weight:700}
.brand .wm small{font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;color:var(--gold2);font-weight:500}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(240,184,68,.18);border:1px solid rgba(240,184,68,.5);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold2);font-size:17px}
.greet{position:relative;z-index:1;margin-top:18px}
.greet small{font-size:13.5px;color:#D4E6E9}
.greet h1{color:#fff;font-size:30px;margin-top:2px;font-weight:600}
.ringwrap{position:relative;z-index:1;display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{width:168px;height:168px;flex:none;position:relative}
.ring svg{width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c small{font-size:12px;color:#D4E6E9}
.ring .c b{font-family:var(--serif);font-size:58px;line-height:.9;font-weight:700;color:#fff}
.ring .c i{font-style:normal;font-size:12px;color:var(--gold2);margin-top:4px}
.side{flex:1;display:flex;flex-direction:column;gap:9px}
.mini{background:rgba(255,255,255,.1);border:1px solid rgba(240,184,68,.25);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:10px}
.mini .e{font-size:19px;line-height:1;color:var(--gold2)}
.mini b{display:block;font-size:16.5px;font-weight:700;line-height:1.1}
.mini span{font-size:11.5px;color:#D4E6E9}
.potbars{position:relative;z-index:1;display:flex;gap:4px;margin-top:20px}
.potbars .pb{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.potbars .pb i{display:block;height:100%;background:linear-gradient(90deg,#F8DCA0,var(--gold2))}
.potleg{position:relative;z-index:1;display:flex;justify-content:space-between;font-size:11.5px;color:#D4E6E9;margin-top:6px}
.potleg b{color:var(--gold2);font-weight:600}
.daynav{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.daynav button{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gold2);padding:6px 4px}
.daynav button:disabled{opacity:.3}
.daynav .today{background:rgba(240,184,68,.18);padding:6px 12px;border-radius:20px}
.quote{margin:-18px 24px 0;position:relative;z-index:2;background:linear-gradient(135deg,#F2F7F8,#E4EFF1);border:1px solid #CFE0E3;border-radius:16px;padding:14px 18px 14px 50px;box-shadow:var(--shadow);font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.3;color:var(--wine)}
.quote::before{content:"\201C";position:absolute;left:16px;top:0;font-size:50px;color:var(--moro)}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.goal .gr{width:58px;height:58px;position:relative}
.goal .gr > svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .gr span{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;color:var(--ink)}
.goal:nth-child(1) .gr span{color:var(--wine)}.goal:nth-child(2) .gr span{color:var(--sky)}.goal:nth-child(3) .gr span{color:var(--amber)}
.goal.ok{color:var(--wine);font-weight:600}
.complete{margin-top:14px;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,var(--amber2),var(--moro2));color:#fff;font-weight:600;font-size:14px}
.capsbtn{width:100%;display:flex;align-items:center;gap:16px;padding:16px 56px 16px 18px;border-radius:16px;background:linear-gradient(135deg,#F3F8F9,#E7EFF1);border:1px solid #CFE0E3;text-align:left;position:relative}
.capsbtn .cap{width:64px;height:30px;flex:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.capsbtn b{display:block;font-size:16px;font-weight:700;color:var(--wine)}
.capsbtn small{font-size:12.5px;color:var(--muted);display:block;line-height:1.35}
.capsbtn[aria-pressed=true]{background:linear-gradient(135deg,var(--wine2),var(--dark));border-color:var(--wine)}
.capsbtn[aria-pressed=true] b{color:var(--gold2)}.capsbtn[aria-pressed=true] small{color:#D4E6E9}
.capsbtn[aria-pressed=true] .cap{transform:rotate(-18deg) scale(1.05)}
.capsbtn.pico{margin-top:10px;background:linear-gradient(135deg,#EEF5FB,#D6E7F6);border-color:#B5D2EA}
.capsbtn.pico .cap{width:40px;height:56px;display:grid;place-items:center}.capsbtn.pico .cap img{max-height:56px;width:auto}
.capsbtn.pico[aria-pressed=true]{background:linear-gradient(135deg,#1F5F94,#123A5C);border-color:#1F5F94}
.capsbtn.pico[aria-pressed=true] .cap{transform:none}
.check-badge{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--gold2);color:var(--dark);display:grid;place-items:center;font-weight:700}
.waterbox{background:linear-gradient(135deg,#EEF6FD,#D9EAF8);margin:-18px;padding:18px;border-radius:16px}
.wright .big{font-family:var(--serif);font-size:38px;color:var(--sky);font-weight:700;line-height:1}
.wright .big small{font-size:16px;color:var(--muted);font-family:var(--sans);font-weight:400}
.drops{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:14px}
.drop{height:42px;border-radius:9px;border:1.5px solid #A9CBE6;background:rgba(255,255,255,.7);transition:background .2s,border-color .2s}
.drop[aria-pressed=true]{background:linear-gradient(180deg,var(--sky2),var(--sky));border-color:var(--sky)}
.wbtns{display:flex;gap:8px;margin-top:10px}
.wbtns button{flex:1;padding:9px;border-radius:10px;background:#fff;color:var(--sky);font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(47,120,183,.15)}
.task{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#F3F8F9,#E7EFF1);border:1px solid #CFE0E3;border-radius:16px;padding:16px 18px;margin:0 16px;box-shadow:var(--shadow)}
.task .ti{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--amber2),var(--amber));color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.task p{flex:1;font-size:15px;line-height:1.4}
.tick{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--gold);flex:none;display:grid;place-items:center;color:transparent;background:#fff;transition:.2s}
.tick[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:var(--gold2)}
.meals{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.mealwrap{position:relative}
.meal{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;border:var(--hair);padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.mealwrap .meal{padding-right:84px}
.meal .art{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;color:#fff;box-shadow:0 6px 14px rgba(6,38,45,.12)}
.meal .tx{flex:1;min-width:0}
.meal .tx small{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.meal .tx b{display:block;font-weight:500;font-size:14.5px;line-height:1.3;color:var(--ink)}
.meal .tx b em{font-style:normal;color:var(--wine);font-weight:700}
.meal .go{color:var(--gold);position:absolute;right:14px;top:16px}
.swap{position:absolute;right:12px;bottom:10px;font-size:11.5px;font-weight:700;color:var(--gold);display:flex;gap:4px;align-items:center;padding:4px 6px;border-radius:8px}
.adapt{display:flex;gap:4px;align-items:center;font-style:normal;font-size:11.5px;color:#4C6B33;margin-top:3px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#fff;color:var(--wine);font-weight:700;box-shadow:0 2px 6px rgba(6,38,45,.12);font-style:normal}
.m-cafe{background:linear-gradient(135deg,var(--amber2),var(--amber))!important}
.m-almoco{background:linear-gradient(135deg,var(--sage2),var(--sage))!important}
.m-lanche{background:linear-gradient(135deg,var(--moro2),var(--moro))!important}
.m-jantar{background:linear-gradient(135deg,var(--plum2),var(--plum))!important}
.food{color:#fff}
.feature{display:block;width:calc(100% - 32px);margin:0 16px;text-align:left;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#fff;border:var(--hair)}
.feature .fa{height:168px;position:relative;display:grid;place-items:center;font-size:76px;overflow:hidden}
.feature .fa .fl{position:absolute;left:14px;top:14px;z-index:3}
.feature .fb{padding:14px 18px 18px}
.feature .fb strong{display:block;font-family:var(--serif);font-size:24px;color:var(--wine);line-height:1.1;font-weight:600}
.chipsrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chipsrow span{font-size:12px;padding:4px 10px;border-radius:20px;background:#EEF3F4;color:var(--ink)}
.food>span:first-child,.gcover.food>span:first-child{display:grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;line-height:1;position:relative;z-index:1;background:radial-gradient(circle,rgba(255,255,255,.6) 0%,rgba(255,255,255,.28) 55%,rgba(255,255,255,0) 72%);filter:drop-shadow(0 10px 14px rgba(6,38,45,.22))}
.meal .art.food>span:first-child{background:none;width:auto;height:auto;filter:none}
.feature .fa.food>span:first-child,.shero.food>span:first-child,.gcover.food>span:first-child{animation:floaty 4.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.moodrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:12px;background:#EEF3F4;font-size:11.5px;color:var(--muted)}
.mood span{font-size:20px;color:var(--wine);opacity:.55;height:20px;display:flex;align-items:center}
.mood[aria-pressed=true]{background:linear-gradient(135deg,var(--wine2),var(--plum));color:#fff}
.mood[aria-pressed=true] span{color:var(--gold2);opacity:1}
textarea,input[type=text],input[type=date],input[type=search],input[inputmode]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:15px}
textarea{min-height:80px;resize:vertical;margin-top:12px}
textarea:focus,input:focus{outline:none;border-color:var(--gold)}
.cta{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;background:linear-gradient(180deg,#22B463,#178A48);color:#fff;font-weight:800;font-size:15.5px;text-decoration:none;letter-spacing:.01em}
.cta.wine{background:linear-gradient(135deg,var(--wine2),var(--dark));color:#fff}
.cta.soft{background:#E6EFF0;color:var(--wine)}
.cta .i{vertical-align:-.18em}
.promo{margin:0 16px;border-radius:20px;padding:20px;background:radial-gradient(circle at 90% 10%,#2F8EA0,var(--wine) 50%,var(--dark));color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.promo .pe{position:absolute;right:10px;top:6px;font-size:64px;color:rgba(240,184,68,.35)}
.promo b{font-family:var(--serif);font-size:23px;color:var(--gold2);display:block;line-height:1.1;max-width:75%}
.promo p{font-size:13.5px;color:#D4E6E9;margin:6px 0 14px;max-width:80%}
.hint{margin:0 16px;border-radius:16px;padding:16px 18px;background:#fff;border:var(--hair);box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.hint .he{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--rose);color:var(--wine);flex:none}
.hint b{font-family:var(--serif);font-size:18px;color:var(--wine);display:block;line-height:1.1}
.hint p{font-size:13px;color:var(--muted)}
.hint .cta{width:auto;padding:10px 14px;font-size:13.5px;flex:none}
/* nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));z-index:20;max-width:456px;margin:0 auto;background:rgba(6,38,45,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 10px 30px rgba(6,38,45,.35);padding:6px}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#B9D2D6;border-radius:18px;transition:.2s}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{color:var(--dark);background:linear-gradient(135deg,#F8DCA0,var(--gold2));font-weight:700}
.nav .buy{position:relative;padding-top:0;color:var(--gold2);font-weight:700}
.nav .buy .buyc{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:linear-gradient(135deg,#F8DCA0,#F0B844 55%,#C98A1E);display:grid;place-items:center;box-shadow:0 8px 20px rgba(201,138,30,.45),0 0 0 5px rgba(6,38,45,.95);transition:transform .2s}
.nav .buy .buyc svg{stroke:var(--dark);width:25px;height:25px;stroke-width:2}
.nav .buy[aria-current=page]{background:none;color:var(--gold2)}
.nav .buy[aria-current=page] .buyc{transform:scale(1.06)}
/* páginas */
.ptop{padding:calc(24px + var(--st)) 20px 4px;position:relative}
.ptop h1{font-size:34px}
.ptop p{color:var(--muted);font-size:14px;margin-top:2px}
.ptop .pe{position:absolute;right:20px;top:calc(28px + var(--st));font-size:30px;color:var(--gold)}
.ptop .back{position:absolute;left:12px;top:calc(22px + var(--st));width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--shadow);color:var(--wine);font-size:22px;line-height:1}
.ptop .back+h1{margin-left:34px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:30px;background:#fff;border:var(--hair);font-size:13.5px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:linear-gradient(135deg,var(--wine2),var(--plum));color:#fff;border-color:transparent}
.search{margin:12px 16px 0;position:relative}
.search input{padding-left:42px;border-radius:16px;border:var(--hair);box-shadow:var(--shadow)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0}
.rc{background:#fff;border-radius:16px;border:var(--hair);overflow:hidden;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column}
.rc .ra{height:104px;display:grid;place-items:center;font-size:44px;position:relative;overflow:hidden}
.rc .ra i.tag{position:absolute;left:8px;top:8px;z-index:3}
.rc .rb{padding:10px 12px 13px}
.rc .rb b{display:block;font-family:var(--serif);font-size:16.5px;line-height:1.15;color:var(--wine);font-weight:600}
.rc .rb small{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty span{font-size:34px;color:var(--gold);display:flex;justify-content:center;margin-bottom:6px}
/* folha */
.sheet-bg{position:fixed;inset:0;background:rgba(6,38,45,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:30px 30px 0 0;z-index:41;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;visibility:hidden;padding:0 0 calc(28px + var(--sb));will-change:transform}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.close{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:3;box-shadow:var(--shadow)}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(6,38,45,.2);position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:3}
.shero{height:220px;display:grid;place-items:center;font-size:88px;position:relative;overflow:hidden}
.sbody{background:var(--cream);border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:22px 20px 0}
.sbody h1{font-size:30px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3 div{background:#fff;border:var(--hair);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stats3 span{font-size:19px;display:flex;justify-content:center;color:var(--amber)}
.stats3 div:nth-child(2) span{color:var(--sage)}.stats3 div:nth-child(3) span{color:var(--plum2)}
.stats3 b{font-size:13px;font-weight:700;display:block;color:var(--wine)}
.stats3 small{font-size:11px;color:var(--muted)}
.sbody h4,.gbody h4{font-family:var(--serif);font-size:21px;color:var(--wine);margin:22px 0 10px;font-weight:600}
.ingl button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ingl button .tick{width:24px;height:24px;border-radius:7px}
.ingl button[aria-pressed=true] span:last-child{text-decoration:line-through;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:var(--hair);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.step b{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--moro2),var(--moro));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:16px;flex:none}
.step p{font-size:14.5px;padding-top:3px}
.tipbox{margin-top:18px;border-radius:16px;padding:16px;background:linear-gradient(135deg,#FFF2E8,#FDE0E4);border:var(--hair);display:flex;gap:12px;font-size:14px}
.tipbox span{font-size:22px;color:var(--wine)}
.tipbox b{color:var(--wine)}
.plain{padding:56px 20px 0}
.plain h1{font-size:30px;margin-bottom:6px}
.rtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rtags span{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;border:1px solid}
.rtags span:nth-child(1){background:#FDE9E1;border-color:#F8CDBD;color:#A63B22}
.rtags span:nth-child(2){background:#E7F2E0;border-color:#CFE3C3;color:#33603F}
.rtags span:nth-child(3){background:#F3E3EE;border-color:#E6C8DB;color:#6B2D5C}
.rtags span:nth-child(4){background:#FDF0D8;border-color:#F3DCAB;color:#8A5A12}
.adaptbox{margin-top:12px;padding:11px 13px;border-radius:12px;background:#EEF2E6;border:1px solid #DFE7D2;color:#3F5A2A;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.adaptbox.warn{background:#FBF1DE;border-color:#EFDCB3;color:#7A5413}
/* medidas */
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0}
.mc{background:#fff;border:var(--hair);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.mc span{font-size:20px;display:flex;justify-content:center;color:var(--amber)}
.mc:nth-child(2) span{color:var(--moro)}.mc:nth-child(3) span{color:var(--plum2)}
.mc b{display:block;font-family:var(--serif);font-size:26px;color:var(--wine);line-height:1.05;margin-top:4px}
.mc b.down{color:var(--sage)}
.mc small{font-size:11.5px;color:var(--muted)}
.seg{display:flex;margin:0 16px;background:#E6EDEE;border-radius:16px;padding:4px}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--wine);font-weight:700;box-shadow:0 2px 6px rgba(6,38,45,.1)}
.chart{width:100%;height:auto;display:block}
.mday{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.md{background:#fff;border:var(--hair);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.md-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.md-h b{font-family:var(--serif);font-size:19px;color:var(--wine)}
.md-h span{font-size:12px;color:var(--muted)}
.md-h .ok{color:#3F7D5A;font-weight:700}
.md-in{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md-in label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
.md-in input{text-align:center;padding:11px 6px;font-weight:700}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.rep div{background:#fff;border:var(--hair);border-top:3px solid var(--wine);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.rep div:nth-child(2){border-top-color:var(--sky)}.rep div:nth-child(3){border-top-color:var(--sage)}.rep div:nth-child(4){border-top-color:var(--moro)}
.rep small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.rep b{display:block;font-family:var(--serif);font-size:28px;color:var(--wine);line-height:1.1;margin-top:4px;font-weight:600}
.rep div:nth-child(2) b{color:var(--sky)}.rep div:nth-child(3) b{color:var(--sage)}.rep div:nth-child(4) b{color:var(--moro)}
.rep span{font-size:11.5px;color:var(--muted)}
/* compras */
.prog{margin:12px 16px 0;background:#fff;border:var(--hair);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.prog .pt{display:flex;justify-content:space-between;font-size:13.5px}
.prog .pt b{color:var(--wine)}
.pbar{height:10px;border-radius:6px;background:#E6EDEE;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#F8DCA0,var(--gold2));transition:width .3s}
.group{margin:12px 16px 0;background:#fff;border:var(--hair);border-radius:16px;padding:14px 16px 6px;box-shadow:var(--shadow)}
.group h3{font-size:20px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.group h3 span{color:var(--gold);font-size:19px;display:flex}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.item:last-child{border-bottom:0}
.item .tick{width:26px;height:26px;border-radius:8px}
.item[aria-pressed=true] span:last-child{text-decoration:line-through;color:var(--muted)}
.subtabs{display:flex;margin:12px 16px 0;background:#E6EDEE;border-radius:16px;padding:4px}
.subtabs button{flex:1;padding:10px 4px;border-radius:12px;font-size:14px;color:var(--muted)}
.subtabs button[aria-pressed=true]{background:linear-gradient(135deg,var(--wine2),var(--plum));color:#fff;font-weight:700}
/* mais */
.badges{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:100px;background:#fff;border:var(--hair);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.badge .bi{width:50px;height:50px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#E9EFF0;color:#9FB2B6}
.badge.on .bi{background:linear-gradient(135deg,var(--amber2),var(--moro));color:#fff;box-shadow:0 6px 14px rgba(209,102,74,.3)}
.badge b{font-size:12px;font-weight:700;display:block;line-height:1.25;color:var(--ink)}
.badge small{font-size:10.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.tile{background:#fff;border:var(--hair);border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:104px;text-decoration:none;color:var(--ink)}
.tile .te{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;color:#fff;box-shadow:0 6px 14px rgba(6,38,45,.12)}
.tile b{font-size:14.5px;font-weight:700;line-height:1.25}
.tile small{font-size:12px;color:var(--muted);line-height:1.3}
.tile.wine{background:linear-gradient(135deg,var(--wine2),var(--dark));color:#fff}
.tile.wine small{color:#D4E6E9}.tile.wine .te{color:var(--gold2)}
.pillar{display:flex;gap:14px;background:#fff;border:var(--hair);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.pillar .pe2{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:23px;color:#fff;flex:none}
.pillar b{color:var(--wine);font-family:var(--serif);font-size:18px;display:block;font-weight:600}
.pillar p{font-size:14px}
.faq{background:#fff;border:var(--hair);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.faq b{font-family:var(--serif);font-size:17.5px;color:var(--wine);display:block;font-weight:600}
.faq p{font-size:14px}
.q{margin-top:16px}
.q label{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--wine)}
.wnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.wnav button{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--shadow);color:var(--wine);font-size:18px}
.wnav button:disabled{opacity:.3}
.wnav b{font-family:var(--serif);font-size:21px;color:var(--wine)}
.list{margin:0 16px;background:#fff;border:var(--hair);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.list button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:var(--hair);text-align:left}
.list button:last-child{border-bottom:0}
.list button span{color:var(--moro);font-size:19px;display:flex}
.list button b{flex:1;font-size:14.5px;font-weight:600;color:var(--ink)}
.list button small{font-size:12.5px;color:var(--muted)}
.list button.danger b,.list button.danger span{color:var(--wine2)}
.legal h4{font-family:var(--serif);font-size:19px;color:var(--wine);margin:16px 0 4px}
.legal p{font-size:14px;line-height:1.55}
.method{display:flex;gap:14px;align-items:center;width:calc(100% - 32px);margin:14px 16px 0;padding:16px;border-radius:18px;background:radial-gradient(circle at 90% 0%,#2F8EA0,var(--wine) 45%,var(--dark));color:#fff;text-align:left;box-shadow:var(--shadow)}
.method .mi{width:46px;height:46px;border-radius:12px;background:rgba(240,184,68,.16);border:1px solid rgba(240,184,68,.4);display:grid;place-items:center;font-size:23px;color:var(--gold2);flex:none}
.method small{display:block;font-size:11.5px;color:var(--gold2)}
.method b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.method em{display:block;font-style:normal;font-size:12.5px;color:#D4E6E9}
.formula{display:flex;flex-direction:column;border:var(--hair);border-radius:16px;background:#fff;overflow:hidden}
.formula div{padding:12px 14px;border-bottom:var(--hair);display:flex;gap:12px;align-items:center}
.formula div:last-child{border-bottom:0}
.formula img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:#EEF3F4}
.formula b{font-family:var(--serif);font-size:17px;color:var(--wine)}
.formula p{font-size:13.5px;color:var(--muted)}
.trust{margin:22px 16px 6px;padding:16px;border-top:1px solid #D7E2E4}
.tr-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.tr-row span{color:var(--gold);font-size:19px;display:flex;flex:none;margin-top:1px}
.tr-row p{font-size:12.5px;color:var(--muted);line-height:1.45}
.tr-row b{color:var(--ink);font-weight:700}
.trust small{display:block;font-size:11px;color:#A8968F;margin-top:4px}
.tipday{margin:14px 16px 0;background:linear-gradient(135deg,#F1F8EC,#DDEED3);border:1px solid #CFE3C3;border-left:4px solid var(--sage);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.tipday .te{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--sage2),var(--sage));color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.tipday small{font-size:12px;color:var(--sage);font-weight:700}
.tipday p{font-size:14.5px;line-height:1.45;margin-top:1px}
/* comprar */
.bhero{margin:12px 16px 0;border-radius:20px;padding:20px;background:radial-gradient(circle at 90% 0%,#2F8EA0,var(--wine) 45%,var(--dark));color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.bh-top{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.bh-num{font-family:var(--serif);font-size:62px;line-height:.9;font-weight:700;color:#fff}
.bh-num small{display:block;font-family:var(--sans);font-size:12px;color:#D4E6E9;font-weight:400;margin-top:6px}
.bh-side{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#E2EEF0}
.bh-side span{display:flex;align-items:center;gap:6px}.bh-side .i{color:var(--gold2)}
.bh-side b{color:var(--gold2);font-weight:700}
.bh-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.16);margin-top:16px;overflow:hidden}
.bh-bar i{display:block;height:100%;background:linear-gradient(90deg,#F8DCA0,var(--gold2))}
.bh-msg{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(240,184,68,.3);font-size:13.5px}
.bh-msg.urg{background:linear-gradient(135deg,#F8DCA0,var(--gold2));color:var(--dark);border:0;font-weight:600}
.kits{display:flex;flex-direction:column;gap:12px;margin:0 16px}
.kit{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);position:relative;border:2px solid #DCE6E7}
.kit.best{border-color:var(--gold2);box-shadow:0 10px 26px rgba(232,154,18,.22)}
.kit-top{display:flex;gap:14px;align-items:center}
.kit-img{width:104px;height:84px;border-radius:12px;object-fit:cover;flex:none;background:#EEF3F4}
.kit-tx{flex:1;min-width:0}
.kit-tx b{display:block;font-family:var(--serif);font-size:21px;color:var(--wine);line-height:1.05;font-weight:700}
.kit-tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.kit-price{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.kit-price .pp b{display:block;font-size:19px;font-weight:800;color:var(--ink)}
.kit-price .pp small{font-size:12.5px;color:var(--muted)}
.kit-price .eco{font-size:12px;font-weight:700;color:#2F5C3A;background:#E7F2E0;padding:4px 10px;border-radius:12px;white-space:nowrap}
.kit .cta{margin-top:12px;padding:13px}
.kit .flag{position:absolute;top:-10px;right:16px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px;background:var(--gold2);color:var(--dark)}
.kit .flag.mine{background:var(--wine);color:#fff}
.perks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 16px}
.perks div{background:#fff;border:var(--hair);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted);line-height:1.3}
.perks span{display:flex;justify-content:center;font-size:20px;color:var(--wine);margin-bottom:4px}
.coupon{margin:14px 16px 0;border-radius:16px;padding:14px 16px;background:#fff;border:2px dashed var(--gold);display:flex;align-items:center;gap:12px}
.coupon b{font-family:var(--serif);font-size:21px;color:var(--wine);letter-spacing:.06em}
.coupon small{display:block;font-size:12px;color:var(--muted)}
.coupon button{margin-left:auto;padding:9px 14px;border-radius:12px;background:var(--wine);color:#fff;font-size:13px;font-weight:700}
.stock{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:18px 16px 0;padding:10px 14px 10px 10px;background:linear-gradient(135deg,#fff,#EFF5F6);border:1px solid #D6E3E5;border-radius:18px;text-align:left;box-shadow:var(--shadow)}
.stock img{width:66px;height:66px;border-radius:13px;object-fit:cover;flex:none}
.st-tx{flex:1;min-width:0}
.st-tx small{font-size:11.5px;color:var(--moro);font-weight:800}
.st-tx b{display:block;font-size:15px;color:var(--ink)}
.st-tx span{font-size:12px;color:var(--muted)}
.st-bar{height:5px;border-radius:3px;background:#F1E3D0;margin-top:6px;overflow:hidden}
.st-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--moro))}
.st-go{flex:none;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--wine2),var(--dark));padding:9px 12px;border-radius:12px}
.stock.urg{background:linear-gradient(135deg,#EFF5F6,#DDE9EB);border-color:#C3D5D8}
.stock.urg .st-go{background:linear-gradient(135deg,var(--amber2),var(--moro))}
/* onboarding */
.ob{min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;background:radial-gradient(ellipse at 80% -5%,#2F8EA0 0%,#1F5F6B 40%,var(--dark) 100%);color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.ob::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(240,184,68,.16);right:-210px;top:-150px;pointer-events:none}
.ob-top{display:flex;align-items:center;gap:12px;padding:calc(14px + var(--st)) 20px 0;position:relative;z-index:1}
.ob-back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:var(--gold2);font-size:24px;line-height:1;display:grid;place-items:center}
.ob-prog{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.ob-prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#F8DCA0,var(--gold2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ob-count{font-size:12px;color:#C9DEE2;width:28px;text-align:right}
.ob-body{flex:1;display:flex;flex-direction:column;padding:26px 24px calc(28px + var(--sb));position:relative;z-index:1}
.ob-step{flex:1;display:flex;flex-direction:column;animation:obin .5s cubic-bezier(.2,.8,.2,1)}
.ob-step.back{animation-name:obback}
@keyframes obin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes obback{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ob-title{font-family:var(--serif);font-weight:600;color:#fff;font-size:33px;line-height:1.08}
.ob-sub{color:#D4E6E9;font-size:15px;margin:10px 0 22px;line-height:1.5}
.ob-input{width:100%;background:#fff;border:2px solid transparent;border-radius:18px;padding:16px 18px;font-size:19px;color:var(--ink);-webkit-text-fill-color:var(--ink);min-height:58px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.ob-input::placeholder{color:#B3A29C;-webkit-text-fill-color:#B3A29C}
.ob-input:focus{outline:none;border-color:var(--gold2)}
input[type=date].ob-input{-webkit-appearance:none;appearance:none;text-align:left}
.ob-foot{margin-top:auto;padding-top:22px}
.ob-foot .cta:disabled{opacity:.45}
.applogo{width:84px;height:84px;margin:0 auto;border-radius:24px;background:radial-gradient(circle at 65% 30%,#2F8EA0,#1F5F6B 50%,var(--dark));border:1.5px solid rgba(240,184,68,.6);display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.35);position:relative}
.applogo svg{width:50px;height:50px}
.applogo.small{width:64px;height:64px;border-radius:19px;margin:6px 0 22px}
.applogo.small svg{width:40px;height:40px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);border:1.5px solid rgba(240,184,68,.25);color:#fff;text-align:left;margin-bottom:10px;transition:background .25s,border-color .25s,transform .15s}
.opt .oe{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:22px;color:var(--gold2);flex:none}
.opt b{display:block;font-weight:700;font-size:15.5px}
.opt small{display:block;font-size:12.5px;color:#C9DEE2;line-height:1.35;margin-top:1px}
.opt[aria-pressed=true]{background:linear-gradient(135deg,#F8DCA0,var(--gold2));border-color:var(--gold2);color:var(--dark)}
.opt[aria-pressed=true] small{color:#5A3A12}
.opt[aria-pressed=true] .oe{background:rgba(255,255,255,.5);color:var(--wine)}
.opt .ck,.pref .ck{margin-left:auto;width:24px;height:24px;border-radius:7px;border:1.5px solid rgba(240,184,68,.5);display:grid;place-items:center;color:transparent;flex:none;font-size:14px}
.opt[aria-pressed=true] .ck{background:var(--wine);border-color:var(--wine);color:var(--gold2)}
.reveal{animation:obin .4s ease;margin-top:4px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hopt{padding:20px 10px;border-radius:16px;background:rgba(255,255,255,.08);border:1.5px solid rgba(240,184,68,.25);color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;transition:background .25s,border-color .25s}
.hopt span{font-size:30px;line-height:1;color:var(--gold2)}
.hopt[aria-pressed=true]{background:linear-gradient(135deg,#F8DCA0,var(--gold2));border-color:var(--gold2);color:var(--dark)}
.hopt[aria-pressed=true] span{color:var(--wine)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.plan{background:rgba(255,255,255,.08);border:1.5px solid rgba(240,184,68,.3);border-radius:18px;padding:10px 10px 12px;text-align:center;color:#fff;position:relative;transition:background .25s,border-color .25s,transform .15s}
.plan img{width:100%;height:84px;object-fit:contain;margin-bottom:6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.plan b{display:block;font-family:var(--serif);font-size:19px;color:var(--gold2);line-height:1.1}
.plan small{font-size:12px;color:#D4E6E9}
.plan[aria-pressed=true]{background:linear-gradient(135deg,#F8DCA0,var(--gold2));border-color:var(--gold2)}
.plan[aria-pressed=true] b{color:var(--wine)}.plan[aria-pressed=true] small{color:var(--dark)}
.other{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;font-size:13px;color:#D4E6E9;position:relative}
.other button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(240,184,68,.55);color:var(--gold2);font-size:18px}
.other b{font-family:var(--serif);font-size:22px;color:#fff;min-width:28px;text-align:center}
.other .use{width:auto;padding:0 14px;border-radius:17px;font-size:13px}
.build{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px}
.bring{width:170px;height:170px;position:relative;margin-bottom:26px}
.bring svg{width:100%;height:100%}
.bpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;padding-top:26px}
.bpct b{font-family:var(--serif);font-size:42px;color:#fff;font-weight:700;line-height:1}
.bpct small{font-size:16px;color:var(--gold2)}
.bleaf{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:38px;height:38px;animation:pulse 1.6s ease-in-out infinite}
.bleaf svg{width:100%;height:100%}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(1.12);opacity:1}}
.blist{list-style:none;margin-top:22px;width:100%;max-width:330px}
.blist li{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14.5px;color:#E2EEF0;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.blist li.show{opacity:1;transform:none}
.bico{width:24px;height:24px;border-radius:50%;border:2px solid rgba(240,184,68,.35);border-top-color:var(--gold2);flex:none;animation:spin .8s linear infinite}
.blist li.done .bico{animation:none;border:0;background:linear-gradient(135deg,#F8DCA0,var(--gold2));position:relative}
.blist li.done .bico::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid var(--dark);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.ready{flex:1;display:flex;flex-direction:column}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.doc{background:#F7FAFA;color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
.doc-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #D7E2E4}
.doc .brand .wm{color:var(--wine);font-size:20px}.doc .brand .wm small{color:var(--gold)}
.doc-id{text-align:right}
.doc-id small{display:block;font-size:10.5px;color:var(--muted)}
.doc-id b{font-size:14px;color:var(--wine);letter-spacing:.06em}
.doc-t{padding:12px 0 2px}
.doc-t small{display:block;font-size:11.5px;color:var(--gold);font-weight:800;letter-spacing:.04em}
.doc-t b{font-family:var(--serif);font-size:25px;color:var(--wine);font-weight:600}
.rcard div{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #DFE8E9;font-size:14px;opacity:0;animation:fadeup .45s ease forwards}
.rcard div:last-child{border-bottom:0}
.rcard div:nth-child(2){animation-delay:.1s}.rcard div:nth-child(3){animation-delay:.2s}.rcard div:nth-child(4){animation-delay:.3s}.rcard div:nth-child(5){animation-delay:.4s}.rcard div:nth-child(6){animation-delay:.5s}.rcard div:nth-child(7){animation-delay:.6s}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rcard span{font-size:19px;width:28px;text-align:center;color:var(--wine);display:flex;justify-content:center}
.doc-f{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:11.5px;color:var(--muted)}
.doc-f span{color:var(--gold);font-size:17px;display:flex}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center}
.wfeat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.wfeat span{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(240,184,68,.3);font-weight:700;font-size:14px}
.wfeat .i{color:var(--gold2);font-size:18px}
.wlink{color:var(--gold2);text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:13px}
.restore{display:block;width:100%;margin-top:14px;color:#D4E6E9;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.prefs{display:flex;flex-direction:column;gap:8px}
.pref{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:var(--hair);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.pref .pi{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--sage2),var(--sage));color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.pref b{display:block;font-size:14.5px;color:var(--ink)}
.pref small{font-size:12px;color:var(--muted)}
.pref .ck{border-color:#C3D5D8}
.pref[aria-pressed=true]{border-color:var(--gold)}
.pref[aria-pressed=true] .ck{background:var(--wine);border-color:var(--wine);color:var(--gold2)}
.photos{margin:0 16px;background:#fff;border:var(--hair);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:var(--hair)}
.prow:last-of-type{border-bottom:0}
.prow>b{font-family:var(--serif);font-size:17px;color:var(--wine);width:62px;flex:none}
.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.pslot{aspect-ratio:3/4;border-radius:10px;border:1.5px dashed #C3D5D8;background:#F7FAFA;display:grid;place-items:center;overflow:hidden;position:relative;color:var(--gold)}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pslot span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px}
.pslot small{font-size:10.5px;color:var(--muted)}
.photos .cta{display:flex;gap:6px;justify-content:center;align-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp figure{margin:0}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.cmp figcaption{text-align:center;font-family:var(--serif);font-size:17px;color:var(--wine);margin-top:4px}
/* instalar */
.addapp{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:14px 16px 0;padding:12px 14px;border-radius:18px;text-align:left;position:relative;background:linear-gradient(120deg,#06262D,#1F5F6B 55%,#2F8EA0);color:#fff;box-shadow:0 12px 26px rgba(31,95,107,.28);overflow:hidden}
.addapp::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.8s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
.aa-ic{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 65% 30%,#2F8EA0,#1F5F6B 55%,#06262D);box-shadow:0 0 0 2px rgba(240,184,68,.75)}
.aa-ic svg{width:28px;height:28px}
.aa-tx{flex:1;min-width:0}
.aa-tx b{display:block;font-size:14.5px;line-height:1.25}
.aa-tx small{display:block;font-size:12px;color:#D4E6E9;margin-top:2px}
.aa-go{flex:none;font-size:12.5px;font-weight:800;color:var(--dark);background:linear-gradient(135deg,#F8DCA0,var(--gold2));padding:9px 12px;border-radius:12px;position:relative;z-index:1}
.aa-x{position:absolute;top:6px;right:8px;font-size:11px;color:#D4E6E9;opacity:.8;padding:2px 4px;z-index:2}
.inst{flex:1;display:flex;flex-direction:column}
.phone{width:196px;height:250px;margin:6px auto 20px;border-radius:30px;background:linear-gradient(180deg,#F3ECE1,#E6DCCD);border:6px solid #1B0405;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.ph-notch{width:62px;height:14px;border-radius:0 0 10px 10px;background:#1B0405;margin:0 auto}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;padding:16px 14px 0}
.ph-grid i{display:block;aspect-ratio:1;border-radius:9px;position:relative}
.ph-grid i.me{background:radial-gradient(circle at 65% 30%,#2F8EA0,#1F5F6B 50%,#06262D);box-shadow:0 0 0 3px var(--gold2),0 6px 14px rgba(31,95,107,.45);animation:pop .7s cubic-bezier(.3,1.6,.5,1) .3s both;z-index:1}
.ph-grid i.me span{position:absolute;inset:14%}.ph-grid i.me span svg{width:100%;height:100%}
.ph-grid i.me em{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);font-style:normal;font-size:8.5px;font-weight:800;color:#3B2A2A;white-space:nowrap}
.ph-dock{position:absolute;left:10px;right:10px;bottom:10px;height:44px;border-radius:16px;background:rgba(255,255,255,.55);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:7px 12px}
.ph-dock i{border-radius:8px;background:#D3CBBF}
.isteps{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.isteps div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#fff;border:var(--hair)}
.isteps b{width:26px;height:26px;border-radius:50%;background:var(--wine);color:var(--gold2);display:grid;place-items:center;font-size:13px;flex:none}
.isteps p{font-size:14px;line-height:1.45;color:var(--ink);text-align:left}
.isteps strong{color:var(--wine)}
.kbd{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#fff;color:#1F6FD1;font-size:16px;vertical-align:middle;margin-left:2px}
.inst .skip{margin-top:14px;padding:12px;width:100%;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

function chart(pts,unit){ const W=320,H=190,L=34,Rr=18,T=30,B=28;
  if(pts.length<2) return `<div class="empty" style="padding:26px 0"><span>§chart§</span>Registre pelo menos duas medidas para ver o gráfico.</div>`;
  const vs=pts.map(p=>p.v); let mn=Math.min(...vs),mx=Math.max(...vs); if(mx-mn<2){mn-=1;mx+=1;}
  const XM=Math.max(30,...pts.map(p=>p.d)); const x=d=>L+(d/XM)*(W-L-Rr), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const line=pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(pts[pts.length-1].d).toFixed(1)} ${H-B} L${x(pts[0].d).toFixed(1)} ${H-B} Z`;
  const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#DCE6E7" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#7A5A55">${v.toFixed(0)}</text>`).join("");
  const xl=pts.map(p=>`<text x="${x(p.d)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#7A5A55">Dia ${p.d}</text>`).join("");
  const dots=pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="6" fill="#fff" stroke="#1F5F6B" stroke-width="3"/><rect x="${x(p.d)-19}" y="${y(p.v)-30}" width="38" height="19" rx="9.5" fill="#1F5F6B"/><text x="${x(p.d)}" y="${y(p.v)-16.5}" text-anchor="middle" font-size="11" font-weight="700" fill="#F0B844">${String(p.v).replace(".",",")}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unit}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B844" stop-opacity=".55"/><stop offset="1" stop-color="#F0B844" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#E89A12" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`; }

/* ===== CARDÁPIO INTELIGENTE ===== */
const RESTR=[["veg","Vegetariana","Sem carnes, frango ou peixe","leaf"],["lac","Sem lactose","Leite, queijo e iogurte sem lactose","cup"],["glu","Sem glúten","Pães e aveia sem glúten","grain"],["peixe","Não como peixe","Troca peixes por outras proteínas","fish"]];
const CONF={veg:/frango|carne|peixe|tilapia|atum|sobrecoxa|musculo|acem|moqueca|strogonoff/,peixe:/peixe|tilapia|atum|moqueca/};
const LAC=/iogurte|queijo|leite(?! de coco)|requeijao|gratinad/, GLU=/pao|aveia|farinha|panqueca|pizza de frigideira|torrada/;
const PLAIN={0:["Ovos mexidos e uma fruta","Iogurte com aveia e fruta"],2:["Uma fruta","Iogurte natural","Castanhas, um punhado","Água de laranja e canela e uma fruta"]};
function restr(){ return S.restr||[]; }
function recOK(r){ const t=norm(r.name+" "+r.ing.join(" ")); return !restr().some(k=>CONF[k]&&CONF[k].test(t)); }
function textOK(x){ const t=norm(x); return !restr().some(k=>CONF[k]&&CONF[k].test(t)); }
function pool(i){ const k=MEALKEY[i]; const rs=DATA.recipes.filter(r=>r.tags.includes(k)&&recOK(r)).map(r=>r.name); return [...new Set([...(PLAIN[i]||[]),...rs])].filter(textOK); }
function baseMenu(n){ const d=(n-1)%21, c=Math.floor((n-1)/21); if(c===0) return DATA.days[d].menu.slice(); return [DATA.days[(d+7*c)%21].menu[0],DATA.days[d].menu[1],DATA.days[(d+3*c)%21].menu[2],DATA.days[(d+14*c)%21].menu[3]]; }
function dayPlan(n){ const base=baseMenu(n), sw=(S.swaps||{})[n]||{}, used=new Set();
  const meals=base.map((x,i)=>{ let txt=x; if(sw[i]!==undefined) txt=sw[i]; else if(!textOK(txt)){ const p=pool(i).filter(o=>!used.has(o)); txt=p.length?p[(n+i)%p.length]:txt; }
    const fr=findRecipe(txt); if(fr) used.add(DATA.recipes[fr.i].name); const si=fr?-1:(S.saved||[]).findIndex(s=>s.name===txt); return {i,text:txt,rec:fr?fr.i:null,saved:si>=0?si:null}; });
  const rd=[1,3,0].map(i=>meals[i]).find(m=>m.rec!==null&&DATA.recipes[m.rec].day)||[1,3,0].map(i=>meals[i]).find(m=>m.rec!==null)||{i:1,rec:0};
  return {meals,rdMeal:rd.i,rd:rd.rec}; }
function swapMeal(n,i){ const p=pool(i); if(!p.length) return; const cur=dayPlan(n).meals[i].text; const k=p.indexOf(cur); S.swaps=S.swaps||{}; S.swaps[n]=S.swaps[n]||{}; S.swaps[n][i]=p[(k+1)%p.length]; save(); }
function adaptNote(txt){ const t=norm(txt), out=[]; if(restr().includes("lac")&&LAC.test(t)) out.push("use versões sem lactose"); if(restr().includes("glu")&&GLU.test(t)) out.push("use versões sem glúten"); return out; }

/* ===== dados da rotina ===== */
function elapsedDays(){ return Math.min(Math.max(currentDay(),0),totalDays()); }
function adherence(){ const e=elapsedDays(); if(e<1) return null; const den=S.days[e]?.caps?e:e-1; if(den<1) return S.days[e]?.caps?100:null; let c=0; for(let i=1;i<=den;i++) if(S.days[i]?.caps) c++; return Math.round(c/den*100); }
function avgOf(key,from,to){ const v=[]; for(let i=from;i<=to;i++){ const x=S.days[i]?.[key]; if(x!==null&&x!==undefined) v.push(x); } return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }

async function exportCode(){ const b0=new TextEncoder().encode(JSON.stringify(S)); let bytes=b0, p="T1";
  if(window.CompressionStream){ try{ const s=new Blob([b0]).stream().pipeThrough(new CompressionStream("deflate-raw")); bytes=new Uint8Array(await new Response(s).arrayBuffer()); p="T2"; }catch(e){ bytes=b0; p="T1"; } }
  let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return p+"."+btoa(bin); }
async function importCode(code){ code=String(code||"").trim().replace(/\s/g,""); const p=code.slice(0,2); let bytes=Uint8Array.from(atob(code.slice(3)),c=>c.charCodeAt(0));
  if(p==="T2"){ const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); bytes=new Uint8Array(await new Response(s).arrayBuffer()); } else if(p!=="T1") throw new Error("x");
  const o=JSON.parse(new TextDecoder().decode(bytes)); if(!o||!o.start||!o.potes) throw new Error("x"); return o; }
